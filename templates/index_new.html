<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Intrusion Detection - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="http://127.0.0.1:5000/static/css/styles.css" rel="stylesheet">
    <style>
        .auth-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 50px 0; background: radial-gradient(circle at 20% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(30, 58, 138, 0.2) 0%, transparent 50%), linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .auth-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 50px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1e3a8a, #06b6d4); }
        .auth-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #1e3a8a, #06b6d4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3); }
        .auth-icon i { font-size: 2rem; color: white; }
        .auth-title { font-family: 'Poppins', sans-serif; font-size: 1.75rem; font-weight: 700; color: #1e3a8a; text-align: center; margin-bottom: 10px; }
        .auth-subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        .form-control { padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; transition: all 0.3s ease; }
        .form-control:focus { border-color: #06b6d4; box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15); outline: none; }
        .form-label { font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .btn-auth { padding: 14px 30px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; }
        .btn-login { background: linear-gradient(135deg, #1e3a8a, #06b6d4); border: none; color: white; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5); }
        .nav-tabs { border: none; justify-content: center; margin-bottom: 30px; }
        .nav-tabs .nav-link { border: none; padding: 12px 30px; font-weight: 600; color: #64748b; border-radius: 10px; transition: all 0.3s ease; }
        .nav-tabs .nav-link.active { background: linear-gradient(135deg, #1e3a8a, #06b6d4); color: white; }
        .nav-tabs .nav-link:hover:not(.active) { background: rgba(6, 182, 212, 0.1); color: #1e3a8a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(15, 23, 42, 0.95);">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shield-alt me-2"></i>Network Intrusion Detection</a>
        </div>
    </nav>
    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-icon"><i class="fas fa-shield-halved"></i></div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access the IDS Portal</p>
            {% if msg %}
            <div class="alert alert-danger alert-dismissible mb-4">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <strong>{{msg}}</strong>
            </div>
            {% endif %}
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#login">Sign In</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#register">Sign Up</a></li>
            </ul>
            <div class="tab-content">
                <div id="login" class="tab-pane fade show active">
                    <form method="post" action="{{ url_for('userlog') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="name" placeholder="Enter username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-auth btn-login">Sign In</button>
                    </form>
                </div>
                <div id="register" class="tab-pane fade">
                    <form method="post" action="{{ url_for('userreg') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="name" placeholder="Choose username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" name="phone" placeholder="Enter mobile number" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Create password" required>
                        </div>
                        <button type="submit" class="btn btn-auth btn-login">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
