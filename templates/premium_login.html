<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network IDS - Secure Access</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* ========================================
           EXCEPTIONAL PREMIUM DESIGN
           ======================================== */
        
        :root {
            /* Sophisticated Dark Palette */
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(20, 20, 30, 0.85);
            --bg-card-hover: rgba(30, 30, 45, 0.9);
            
            /* Vibrant Accent Colors */
            --accent-primary: #00d4ff;
            --accent-secondary: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #db2777 100%);
            --accent-glow: rgba(0, 212, 255, 0.4);
            
            /* Warm Neutrals */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            
            /* Effects */
            --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 60px rgba(0, 212, 255, 0.15);
            --border-glow: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Typography */
            --font-display: 'Sora', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ========================================
           CREATIVE BACKGROUND ANIMATION
           ======================================== */
        
        /* Animated Mesh Gradient */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 60% 20%, rgba(219, 39, 119, 0.1) 0%, transparent 35%),
                radial-gradient(circle at 30% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 35%);
            animation: meshFloat 20s ease-in-out infinite;
        }

        @keyframes meshFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-3deg); }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 212, 255, 0.2);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(124, 58, 237, 0.2);
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: rgba(219, 39, 119, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Geometric Pattern Overlay */
        .geo-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        /* ========================================
           PREMIUM CARD DESIGN
           ======================================== */

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: var(--border-glow);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: var(--shadow-premium), var(--shadow-glow);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-premium), 0 0 80px rgba(0, 212, 255, 0.2);
        }

        /* Decorative Top Bar */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
        }

        /* ========================================
           LOGO & HEADER
           ======================================== */

        .logo-container {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            position: relative;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(0, 212, 255, 0.5); }
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: var(--accent-gradient);
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* ========================================
           TAB SWITCHER
           ======================================== */

        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 32px;
            position: relative;
        }

        .tab-switcher::before {
            content: '';
            position: absolute;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: var(--accent-gradient);
            border-radius: 10px;
            top: 5px;
            left: 5px;
            transition: transform 0.3s ease;
            z-index: 0;
        }

        .tab-switcher.signup-active::before {
            transform: translateX(100%);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            color: white;
        }

        .tab-btn i {
            font-size: 0.85rem;
        }

        /* ========================================
           FORMS
           ======================================== */

        .auth-form {
            display: none;
            animation: fadeSlideIn 0.4s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        .form-group:focus-within .form-label {
            color: var(--accent-primary);
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            padding-left: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 42px;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .form-group:focus-within .input-icon {
            color: var(--accent-primary);
        }

        /* ========================================
           BUTTONS
           ======================================== */

        .btn-submit {
            width: 100%;
            padding: 18px 32px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            margin-top: 10px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .btn-submit:hover::before {
            opacity: 1;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Social Login */
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .divider span {
            padding: 0 16px;
        }

        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        /* ========================================
           ALERTS
           ======================================== */

        .alert-custom {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        /* ========================================
           FOOTER LINKS
           ======================================== */

        .auth-footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: white;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */

        @media (max-width: 576px) {
            .auth-card {
                padding: 36px 24px;
            }

            .brand-title {
                font-size: 1.5rem;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .form-input {
                padding: 14px 16px;
                padding-left: 44px;
            }

            .input-icon {
                left: 16px;
                top: 38px;
            }
        }

        /* ========================================
           FLOATING SHAPES DECORATION
           ======================================== */

        .floating-shape {
            position: fixed;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 0;
            animation: floatShape 20s linear infinite;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            top: 10%;
            left: 5%;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            bottom: 15%;
            right: 8%;
            animation-delay: -10s;
        }

        @keyframes floatShape {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Creative Background -->
    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="geo-pattern"></div>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <!-- Main Auth Card -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo & Brand -->
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1 class="brand-title">Network IDS</h1>
                <p class="brand-subtitle">Secure Access Portal</p>
            </div>

            <!-- Alert Messages -->
            {% if msg %}
            <div class="alert-custom alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{msg}}</span>
            </div>
            {% endif %}

            <!-- Tab Switcher -->
            <div class="tab-switcher" id="tabSwitcher">
                <button type="button" class="tab-btn active" data-tab="signin">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <button type="button" class="tab-btn" data-tab="signup">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </div>

            <!-- Sign In Form -->
            <form method="post" action="{{ url_for('userlog') }}" class="auth-form active" id="signinForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" name="name" placeholder="Enter your username" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock input-icon"></i>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-arrow-right me-2"></i> Access Portal
                </button>
            </form>

            <!-- Sign Up Form -->
            <form method="post" action="{{ url_for('userreg') }}" class="auth-form" id="signupForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" name="name" placeholder="Choose a username" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" name="email" placeholder="Enter your email" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" class="form-input" name="phone" placeholder="Enter mobile number" required>
                    <i class="fas fa-phone input-icon"></i>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" name="password" placeholder="Create a password" required>
                    <i class="fas fa-lock input-icon"></i>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus me-2"></i> Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="social-btn" title="Google">
                    <i class="fab fa-google"></i>
                </button>
                <button type="button" class="social-btn" title="GitHub">
                    <i class="fab fa-github"></i>
                </button>
                <button type="button" class="social-btn" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Protected by enterprise-grade security</p>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching Logic
        const tabSwitcher = document.getElementById('tabSwitcher');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;

                // Update tab buttons
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update forms
                if (tab === 'signin') {
                    signinForm.classList.add('active');
                    signupForm.classList.remove('active');
                    tabSwitcher.classList.remove('signup-active');
                } else {
                    signupForm.classList.add('active');
                    signinForm.classList.remove('active');
                    tabSwitcher.classList.add('signup-active');
                }
            });
        });

        // Input Focus Effects
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
